services:
  postgres:
    image: postgres:16-alpine
    container_name: ldi-postgres
    environment:
      POSTGRES_USER: ldi_user
      POSTGRES_PASSWORD: ldi_password
      POSTGRES_DB: ldi_db
    ports:
      - "5432:5432"
    volumes:
      - ldi_postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ldi_user -d ldi_db"]
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    container_name: ldi-redis
    ports:
      - "6379:6379"
    volumes:
      - ldi_redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

  minio:
    image: minio/minio:latest
    container_name: ldi-minio
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: minioadmin
      MINIO_ROOT_PASSWORD: minioadmin
    ports:
      - "9000:9000"
      - "9001:9001"
    volumes:
      - ldi_minio_data:/data
    healthcheck:
      test: ["CMD", "mc", "ready", "local"]
      interval: 10s
      timeout: 5s
      retries: 5

  api:
    build:
      context: .
      dockerfile: infrastructure/docker/Dockerfile.api
    container_name: ldi-api
    environment:
      APP_ENV: production
      DATABASE_URL: postgresql+psycopg://ldi_user:ldi_password@postgres:5432/ldi_db
      REDIS_URL: redis://redis:6379/0
      CELERY_BROKER_URL: redis://redis:6379/0
      CELERY_RESULT_BACKEND: redis://redis:6379/1
      STORAGE_BACKEND: minio
      S3_ENDPOINT_URL: http://minio:9000
      S3_BUCKET_NAME: ldi-documents-private
      S3_ACCESS_KEY_ID: minioadmin
      S3_SECRET_ACCESS_KEY: minioadmin
      SECRET_KEY: ${SECRET_KEY:-dev-change-in-production-secret-key-64-chars-long-1234567890}
      SIGNED_URL_SECRET: ${SIGNED_URL_SECRET:-dev-change-in-production-signed-secret-64-chars-long}
      AI_PROVIDER: ${AI_PROVIDER:-LOCAL_DETERMINISTIC}
      ALLOW_EXTERNAL_AI: ${ALLOW_EXTERNAL_AI:-false}
      GEMINI_API_KEY: ${GEMINI_API_KEY:-}
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
      CORS_ORIGINS: '["http://localhost:3000","http://127.0.0.1:3000"]'
    ports:
      - "8000:8000"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    command: >
      sh -c "alembic upgrade head && python -m app.services.seed_cli && uvicorn app.main:app --host 0.0.0.0 --port 8000"

  worker:
    build:
      context: .
      dockerfile: infrastructure/docker/Dockerfile.api
    container_name: ldi-worker
    environment:
      APP_ENV: production
      DATABASE_URL: postgresql+psycopg://ldi_user:ldi_password@postgres:5432/ldi_db
      REDIS_URL: redis://redis:6379/0
      CELERY_BROKER_URL: redis://redis:6379/0
      CELERY_RESULT_BACKEND: redis://redis:6379/1
      STORAGE_BACKEND: minio
      S3_ENDPOINT_URL: http://minio:9000
      S3_BUCKET_NAME: ldi-documents-private
      S3_ACCESS_KEY_ID: minioadmin
      S3_SECRET_ACCESS_KEY: minioadmin
      SECRET_KEY: ${SECRET_KEY:-dev-change-in-production-secret-key-64-chars-long-1234567890}
      SIGNED_URL_SECRET: ${SIGNED_URL_SECRET:-dev-change-in-production-signed-secret-64-chars-long}
      AI_PROVIDER: ${AI_PROVIDER:-LOCAL_DETERMINISTIC}
      ALLOW_EXTERNAL_AI: ${ALLOW_EXTERNAL_AI:-false}
      GEMINI_API_KEY: ${GEMINI_API_KEY:-}
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    command: celery -A app.workers.celery_app.celery_app worker --loglevel=info

  web:
    build:
      context: .
      dockerfile: infrastructure/docker/Dockerfile.web
      args:
        NEXT_PUBLIC_API_URL: http://localhost:8000
    container_name: ldi-web
    environment:
      NEXT_PUBLIC_API_URL: http://localhost:8000
    ports:
      - "3000:3000"
    depends_on:
      - api

volumes:
  ldi_postgres_data:
  ldi_redis_data:
  ldi_minio_data:
